[package]
name = "airbug-macros"
version = "0.5.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Optional procedural macros for airbug test helpers"
[lib]
proc-macro = true
[dependencies]
syn = { version = "2.0.118", features = ["full", "visit"] }
quote = "1.0.45"
proc-macro2 = "1.0.107"
proc-macro-crate = "3.5.0"
