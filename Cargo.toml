[workspace]
resolver = "3"
members = [
    "unit/airbug",
    "unit/airbug-macros",
    "unit/checkout-domain",
    "unit/containers",
    "bench",
    "bench/rbench-macros",
    "bench/cargo-rbench",
    "otel/monik",
    "dash/hub",
]
default-members = [
    "unit/airbug",
    "unit/airbug-macros",
    "unit/checkout-domain",
    "unit/containers",
    "bench",
    "bench/rbench-macros",
    "bench/cargo-rbench",
    "dash/hub",
]
exclude = [
    "integrations/forma",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
