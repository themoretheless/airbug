[package]
name = "airbug"
version = "0.5.0"
edition = "2024"
rust-version = "1.96"
description = "Object generation graphs, fluent assertions, validation, and method mocks"
license = "MIT"
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md", "TOP50.md", "PILOT.md"]

[workspace]
members = ["airbug-macros"]
resolver = "3"

[features]
default = []
macros = ["dep:airbug-macros"]

[dependencies]
airbug-macros = { version = "=0.5.0", path = "airbug-macros", optional = true }

[[example]]
name = "native_service"
required-features = ["macros"]

[[example]]
name = "checkout_pilot"
required-features = ["macros"]
