[workspace]
resolver = "3"
members = [
    "unit",
    "unit/macros",
    "unit/checkout-domain",
    "unit/containers",
    "bench",
    "bench/macros",
    "bench/cli",
    "mon",
    "otel",
    "err",
    "dash/hub",
]
default-members = [
    "unit",
    "unit/macros",
    "unit/checkout-domain",
    "unit/containers",
    "bench",
    "bench/macros",
    "bench/cli",
    "mon",
    "otel",
    "err",
    "dash/hub",
]
exclude = [
    "bench/integrations/forma",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
airbug-macros = { path = "unit/macros", version = "0.6.0" }
airbug-bench = { path = "bench", version = "0.1.3" }
airbug-bench-macros = { path = "bench/macros", version = "0.1.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
anyhow = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = true, features = ["blocking", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.30", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.30", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["trace", "metrics", "logs"] }
