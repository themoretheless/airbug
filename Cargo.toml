[workspace]
resolver = "3"
members = [
    "unit",
    "unit/macros",
    "unit/checkout-domain",
    "unit/containers",
    "bench",
    "bench/macros",
    "bench/cli",
    "mon",
    "otel",
    "err",
    "dash/hub",
]
default-members = [
    "unit",
    "unit/macros",
    "unit/checkout-domain",
    "unit/containers",
    "bench",
    "bench/macros",
    "bench/cli",
    "dash/hub",
]
exclude = [
    "bench/integrations/forma",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
