name: Publish dry-run

on:
  workflow_dispatch:
  push:
    paths:
      - 'unit/**'
      - 'bench/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/publish-dry-run.yml'

permissions:
  contents: read

concurrency:
  group: publish-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Package validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: themoretheless/.github/.github/actions/setup-rust@a6c40a906bc786a3668362d270ca95212b5bffce # v1
        with:
          rust-toolchain: "1.96.0"

      # Leaf macros have no unpublished path deps — shared publish-crate dry-run works.
      - name: Dry-run airbug-macros
        uses: themoretheless/.github/.github/actions/publish-crate@a6c40a906bc786a3668362d270ca95212b5bffce # v1
        with:
          package-name: airbug-macros
          dry-run: true

      - name: Dry-run airbug-bench-macros
        uses: themoretheless/.github/.github/actions/publish-crate@a6c40a906bc786a3668362d270ca95212b5bffce # v1
        with:
          package-name: airbug-bench-macros
          dry-run: true
