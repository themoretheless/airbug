# Temporary diagnostics for the arena branch (raw CI logs are unreachable from the sandbox).
name: Diag
on:
  push:
    branches: ['arena/**']
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: cargo fmt and push
        run: |
          cargo +stable fmt --all
          if ! git diff --quiet; then
            git config user.name "ci-fmt"
            git config user.email "ci-fmt@users.noreply.github.com"
            git commit -am "cargo fmt (diag)"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: clippy
        run: cargo +stable clippy --locked --workspace --all-features --all-targets --exclude airbug-mon -- -D warnings > clippy.log 2>&1 || true
      - run: python3 .github/diag/emit.py clippy.log clippy
      - name: tests
        run: cargo +stable test --locked -p airbug-hub -p airbug --all-features --no-fail-fast > test.log 2>&1 || true
      - run: python3 .github/diag/emit.py test.log test
      - name: nextest e2e
        run: cargo +stable test --locked -p airbug-hub --test serve_smoke -- --nocapture --test-threads 1 runner > e2e.log 2>&1 || true
      - run: python3 .github/diag/emit.py e2e.log e2e
      - name: doc
        run: RUSTDOCFLAGS="-D warnings" cargo +stable doc --locked --workspace --all-features --no-deps --exclude airbug-mon > doc.log 2>&1 || true
      - run: python3 .github/diag/emit.py doc.log doc
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - name: tests
        run: cargo +stable test --locked -p airbug-hub -p airbug --all-features --no-fail-fast > test.log 2>&1 || true
      - run: python .github/diag/emit.py test.log wintest
