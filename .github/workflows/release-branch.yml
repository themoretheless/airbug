# Keep the long-lived `release` branch on the latest airbug / airbug-bench tag tip
# (git deps: branch = "release"), matching the rbench install pattern.
name: Advance release branch

on:
  push:
    tags:
      - 'airbug-v*'
      - 'airbug-bench-v*'

permissions:
  contents: write

concurrency:
  group: advance-release-branch
  cancel-in-progress: false

jobs:
  advance:
    name: Update release branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Point release at tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release "${GITHUB_SHA}"
          git push origin release --force
          echo "release -> ${GITHUB_SHA} (${GITHUB_REF_NAME})"
