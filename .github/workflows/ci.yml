name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ['1.96.0', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy --component rustfmt
      - run: python -m unittest discover -s unit/tools/tests -v
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      - run: cargo +${{ matrix.toolchain }} fmt --all --check
      - run: cargo +${{ matrix.toolchain }} test --locked --all-features
      - run: cargo +${{ matrix.toolchain }} test --locked -p airbug --no-default-features
      - run: cargo +${{ matrix.toolchain }} test --locked --all-features --release
      - run: cargo +${{ matrix.toolchain }} doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo +${{ matrix.toolchain }} run --locked -p airbug --features macros --example native_service
      - run: cargo +${{ matrix.toolchain }} run --locked -p airbug --example top50
      - run: cargo +${{ matrix.toolchain }} run --locked -p airbug --features macros --example checkout_pilot -- success
      - run: cargo +${{ matrix.toolchain }} run --locked -p airbug --features macros --example checkout_pilot -- decline
      - run: cargo +${{ matrix.toolchain }} run --locked -p airbug --features macros --example checkout_pilot -- store-failure
      - run: cargo +${{ matrix.toolchain }} clippy --locked --all-features --all-targets -- -D warnings
      - run: python unit/tools/verify_packages.py --toolchain ${{ matrix.toolchain }}

  airbug-otel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked -p airbug-otel
      - run: cargo +stable check --locked -p airbug-otel --no-default-features --features otlp-grpc

  airbug-err:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked -p airbug-err
      - run: cargo +stable test --locked -p airbug-hub

  airbug-mon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable check --locked -p airbug-mon

  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install stable --profile minimal
      - name: Generate web report
        run: python unit/tools/airbug_report.py --all-features --locked --doc-tests
        env:
          RUSTUP_TOOLCHAIN: stable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airbug-web-report
          path: target/airbug-report/
          if-no-files-found: warn
