name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ['1.96.0', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy --component rustfmt
      - run: cargo +${{ matrix.toolchain }} fmt --all --check
      - run: cargo +${{ matrix.toolchain }} test --locked --workspace --all-features
      - run: cargo +${{ matrix.toolchain }} test --locked -p runit --no-default-features
      - run: cargo +${{ matrix.toolchain }} test --locked --workspace --all-features --release
      - run: cargo +${{ matrix.toolchain }} run --locked --features macros --example native_service
      - run: cargo +${{ matrix.toolchain }} run --locked --example top50
      - run: cargo +${{ matrix.toolchain }} run --locked --features macros --example checkout_pilot -- success
      - run: cargo +${{ matrix.toolchain }} run --locked --features macros --example checkout_pilot -- decline
      - run: cargo +${{ matrix.toolchain }} run --locked --features macros --example checkout_pilot -- store-failure
      - run: cargo +${{ matrix.toolchain }} clippy --locked --workspace --all-features --all-targets -- -D warnings
      - run: cargo +${{ matrix.toolchain }} doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python tools/verify_packages.py --toolchain ${{ matrix.toolchain }}
