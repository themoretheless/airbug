[package]
name = "rbench-forma-example"
version = "0.1.0"
edition = "2021"
publish = false

# A separate workspace keeps Forma/wgpu out of the benchmark library graph.
[workspace]

[dependencies]
rbench = { path = "../../bench" }
forma-vector = { path = "../../research/private/forma/vector-ui", features = ["gpu"] }
wgpu = "=29.0.4"
pollster = "0.4"
serde_json = "1"

sha2 = "0.10"
png = "0.17"

winit = {version="0.30",optional=true}
[features]
window=["dep:winit"]
[[bin]]
name="rbench-forma-window"
path="src/window.rs"
required-features=["window"]
