[package]
name = "airbug-bench"
version = "0.9.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
rust-version.workspace = true
repository = "https://github.com/themoretheless/airbug"
description = "Explicit, reproducible Rust benchmarks and scenario observations"
keywords = ["benchmark", "performance", "profiling", "statistics"]
categories = ["development-tools::profiling", "development-tools::testing"]

[features]
default = ["macros"]
memory = ["dep:backtrace"]
macros = ["dep:airbug-bench-macros"]
async-tokio = ["dep:tokio"]
async-futures = ["dep:futures-executor"]
async-smol = ["dep:smol"]

[dependencies]
airbug = { path = "../unit", version = "0.6.2", default-features = false }
backtrace = { version = "=0.3.76", optional = true }
airbug-bench-macros = { workspace = true, optional = true }
regex-automata = "0.4.18"
tokio = { workspace = true, optional = true, features = ["time", "net"] }
futures-executor = { version = "0.3", optional = true }
smol = { version = "2.0", optional = true, default-features = false }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.airbug_bench]
targets = ["workloads"]

[[bench]]
name = "workloads"
harness = false

[[bench]]
name = "attributed"
harness = false
required-features = ["macros"]

[[example]]
name = "memory"
required-features = ["memory"]
