[package]
name = "bench-forma-example"
version = "0.1.0"
edition = "2024"
publish = false

# A separate workspace keeps Forma/wgpu out of the benchmark library graph.
[workspace]

[dependencies]
airbug-bench = { path = "../..", features = ["memory"] }
forma-vector = { package = "forma", path = "../../../../forma/crates/forma", features = ["gpu"] }
wgpu = { package = "gpu-runtime", path = "../../../../forma/crates/gpu-runtime" }
pollster = "0.4"
serde_json = "1"

sha2 = "0.10"
png = "0.17"

winit = {version="0.30",optional=true}
[features]
window=["dep:winit"]
[[bin]]
name="bench-forma-window"
path="src/window.rs"
required-features=["window"]
