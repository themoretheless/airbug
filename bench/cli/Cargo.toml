[package]
name = "cargo-airbug-bench"
version = "0.7.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
rust-version.workspace = true
repository = "https://github.com/themoretheless/airbug"
readme = "../README.md"
description = "Local benchmark runner, Forma importer and offline reports"
keywords = ["benchmark", "cargo-subcommand", "performance", "profiling"]
categories = ["development-tools::profiling", "command-line-utilities"]

[dependencies]
airbug-bench = { workspace = true, features = ["memory"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml_edit = "0.22"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
