name: bench smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Template assumes this bench workspace. For another repository, install a pinned CLI first.
      - run: cargo install --path bench/cli --locked
      - run: cargo airbug-bench bench --repetitions 3 -o .airbug-bench/ci -- --profile quick
      - name: Offline reports
        shell: bash
        run: |
          for run in .airbug-bench/ci/*/run.json; do
            cargo airbug-bench report "$run" -o "${run%/run.json}/report.html"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results
          path: .airbug-bench/ci
          include-hidden-files: true
          if-no-files-found: warn
      # Shared hosted runners give smoke evidence, not controlled regression evidence.
      # Add 'cargo airbug-bench gate RUN --config budgets.json' for project-specific absolute budgets.
