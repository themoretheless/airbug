[package]
name = "airbug-mon"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false
description = "Native macOS host monitor (egui + sysinfo + SQLite), optional OTLP export"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_plot = "0.32"
sysinfo = "0.33"
rusqlite = { workspace = true }
crossbeam-channel = "0.5"
serde = { workspace = true }
serde_json.workspace = true
chrono = "0.4"
notify-rust = "4"
airbug-otel = { path = "../otel" }
tracing.workspace = true
tracing-subscriber.workspace = true
