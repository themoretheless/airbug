[package]
name = "airbug-mon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false
description = "Native macOS host monitor (egui + sysinfo + SQLite), optional OTLP export"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_plot = "0.32"
sysinfo = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
notify-rust = "4"
airbug-otel = { path = "../otel" }
opentelemetry = { version = "0.30", default-features = false, features = ["metrics"] }
