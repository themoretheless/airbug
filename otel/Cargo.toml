[package]
name = "airbug-otel"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false
description = "OpenTelemetry traces, metrics, logs, and profiles for airbug (OTLP)"
repository = "https://github.com/themoretheless/airbug"
keywords = ["opentelemetry", "otlp", "tracing", "metrics", "logs"]
categories = ["development-tools", "development-tools::debugging"]

[features]
default = ["otlp-http", "tracing-bridge"]
## OTLP over HTTP/protobuf and HTTP/JSON (default collector port 4318).
otlp-http = [
    "opentelemetry-otlp/http-proto",
    "opentelemetry-otlp/http-json",
    "opentelemetry-otlp/reqwest-blocking-client",
    "dep:reqwest",
    "dep:flate2",
    "dep:opentelemetry-http",
    "dep:async-trait",
]
## OTLP over gRPC/tonic (collector port 4317). Needs a Tokio runtime held by TelemetryGuard.
## With both OTLP features enabled, HTTP stays the default and OTEL_EXPORTER_OTLP_PROTOCOL=grpc opts in.
otlp-grpc = [
    "dep:tokio",
    "dep:tonic",
    "opentelemetry-otlp/grpc-tonic",
    "opentelemetry-otlp/gzip-tonic",
]
## Bridge `tracing` spans & events into OpenTelemetry spans and structured logs.
tracing-bridge = ["dep:tracing", "dep:tracing-subscriber"]
## In-memory exporters for unit tests (`install_test`).
testing = ["opentelemetry_sdk/testing"]

[dependencies]
opentelemetry = { workspace = true, default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { workspace = true, default-features = false, features = ["trace", "metrics", "logs", "spec_unstable_metrics_views"] }
opentelemetry-otlp = { workspace = true, default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-proto = { version = "0.30", default-features = false, features = ["gen-tonic-messages", "with-serde", "trace", "metrics", "logs", "profiles"] }
prost = "0.13"
hex = "0.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait = { version = "0.1", optional = true }
flate2 = { version = "1", optional = true }
opentelemetry-http = { version = "0.30", default-features = false, features = ["reqwest"], optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tonic = { version = "0.13", default-features = false, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
airbug-bench = { workspace = true, features = ["memory"] }
airbug-err = { path = "../err" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[[example]]
name = "full_stack"
path = "examples/full_stack.rs"
required-features = ["otlp-http", "tracing-bridge"]
