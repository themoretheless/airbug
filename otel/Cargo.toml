[package]
name = "airbug-otel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false
description = "OpenTelemetry traces, metrics, and logs for airbug (OTLP)"
repository = "https://github.com/themoretheless/airbug"
keywords = ["opentelemetry", "otlp", "tracing", "metrics", "logs"]
categories = ["development-tools", "development-tools::debugging"]

[features]
default = ["otlp-http"]
## OTLP over HTTP/protobuf (default collector port 4318).
otlp-http = ["opentelemetry-otlp/http-proto", "opentelemetry-otlp/reqwest-blocking-client"]
## OTLP over gRPC/tonic (collector port 4317). Needs a Tokio runtime held by TelemetryGuard.
otlp-grpc = ["dep:tokio", "opentelemetry-otlp/grpc-tonic"]

[dependencies]
opentelemetry = { version = "0.30", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.30", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["trace", "metrics", "logs"] }
thiserror = "2"
tokio = { version = "1", optional = true, features = ["rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
