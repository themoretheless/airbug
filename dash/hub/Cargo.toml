[package]
name = "airbug-hub"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false
description = "Cross-domain dashboard for the airbug monorepo (unit / bench / mon / otel / err)"

[[bin]]
name = "airbug-hub"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ctrlc = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
