# Local OTEL stack for the airbug dashboard.
# From repo root:
#   docker compose -f dash/collector/docker-compose.yml up -d
# Or: cargo run -p airbug-hub -- serve --collector
#
# OTLP:  grpc :4317  http :4318
# Jaeger UI: http://127.0.0.1:16686/
# Hub reads logs from dash/collector/data/logs.json

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config.yaml:/etc/otelcol/config.yaml:ro
      - ./data:/var/lib/otelcol
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.66.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
