# Standalone OpenTelemetry Collector (no Docker / no Jaeger).
# Hub rewrites __LOGS_PATH__ and __METRICS_PATH__ under dash/collector/data/.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: basic
  file/logs:
    path: __LOGS_PATH__
    rotation:
      max_megabytes: 32
      max_backups: 3
  file/metrics:
    path: __METRICS_PATH__
    rotation:
      max_megabytes: 32
      max_backups: 3

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/logs]
  telemetry:
    logs:
      level: info
