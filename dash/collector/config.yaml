# Local OpenTelemetry Collector for airbug-hub.
# Receives OTLP traces/metrics/logs; traces → Jaeger; logs/metrics → files for the hub UI.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: basic
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  file/logs:
    path: /var/lib/otelcol/logs.json
    rotation:
      max_megabytes: 32
      max_backups: 3
  file/metrics:
    path: /var/lib/otelcol/metrics.json
    rotation:
      max_megabytes: 32
      max_backups: 3

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/logs]
  telemetry:
    logs:
      level: info
