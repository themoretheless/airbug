[package]
name = "airbug"
version = "0.6.2"
edition.workspace = true
rust-version.workspace = true
description = "Object generation graphs, fluent assertions, validation, and method mocks"
license = "MIT"
repository = "https://github.com/themoretheless/airbug"
keywords = ["testing", "mocking", "assertions", "fixtures", "validation"]
categories = ["development-tools::testing", "development-tools"]
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md", "TOP50.md", "NEXT50.md", "PILOT.md"]

# Without this docs.rs would build with default features, hiding the entire
# macro API (#[mock], #[cases], #[derive(Generate)]) from the published docs.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
macros = ["dep:airbug-macros", "airbug-checkout-domain/macros"]
## Canonical JSON snapshots (`Snapshots::check_json`).
json = ["dep:serde_json"]

[dependencies]
airbug-macros = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
airbug-checkout-domain = { path = "checkout-domain" }

[[example]]
name = "native_service"
required-features = ["macros"]

[[example]]
name = "checkout_pilot"
required-features = ["macros"]

[[example]]
name = "next50"
