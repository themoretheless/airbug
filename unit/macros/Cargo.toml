[package]
name = "airbug-macros"
version = "0.6.2"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository = "https://github.com/themoretheless/airbug"
description = "Optional procedural macros for airbug test helpers"
keywords = ["testing", "mocking", "macros", "proc-macro"]
categories = ["development-tools::testing"]
[lib]
proc-macro = true
[dependencies]
syn = { version = "2.0.118", features = ["full", "visit"] }
quote = "1.0.45"
proc-macro2 = "1.0.107"
proc-macro-crate = "3.5.0"
