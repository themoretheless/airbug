# Shared demonstration domain for the checkout pilot. Used by both the examples
# and the pilot tests, so it is a real crate rather than a file both reach into
# with #[path]. Never published.
[package]
name = "airbug-checkout-domain"
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Demonstration checkout domain used by the airbug pilot tests and examples"
publish = false

[features]
# Mirrors airbug's own feature, so enabling macros on airbug does not get forced
# on by this crate through feature unification.
macros = ["dep:airbug", "airbug/macros"]

[dependencies]
airbug = { path = "..", default-features = false, optional = true }
